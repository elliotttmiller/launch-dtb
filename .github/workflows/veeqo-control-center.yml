name: Veeqo Control Center Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/bootstrap.php'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/Veeqo/**'
      - 'scripts/smoke-dtb-veeqo-admin.ps1'
      - 'scripts/test-dtb-veeqo-credential-boundary.php'
      - 'docs/veeqo-operations-admin.md'
      - 'docs/architecture/veeqo-**'
      - '.github/workflows/veeqo-control-center.yml'
  push:
    branches: [main]
    paths:
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/bootstrap.php'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/Veeqo/**'
      - 'scripts/smoke-dtb-veeqo-admin.ps1'
      - 'scripts/test-dtb-veeqo-credential-boundary.php'
      - '.github/workflows/veeqo-control-center.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veeqo-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Veeqo control center
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test credential boundary
        run: php scripts/test-dtb-veeqo-credential-boundary.php

      - name: Run focused Veeqo validation
        shell: pwsh
        run: ./scripts/smoke-dtb-veeqo-admin.ps1
