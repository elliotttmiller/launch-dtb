name: Catalog Consolidation Audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/catalog/audit_catalog_consolidation.py"
      - ".github/workflows/catalog-consolidation-audit.yml"
      - "products/launch/official/dtb_official_catalog.csv"
      - "products/launch/official/dtb_official_catalog_content_seo.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Audit official catalog consolidation
        run: python scripts/catalog/audit_catalog_consolidation.py

      - name: Persist consolidation audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f products/dev/catalog-consolidation/
          if git diff --cached --quiet; then
            echo "Audit artifacts unchanged"
          else
            git commit -m "Record catalog consolidation audit"
            git push origin HEAD:main
          fi

      - name: Upload consolidation audit
        uses: actions/upload-artifact@v4
        with:
          name: catalog-consolidation-audit
          path: products/dev/catalog-consolidation/
          if-no-files-found: error
