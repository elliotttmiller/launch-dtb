name = "commerce_checkout"
description = "DTB checkout/payment contract specialist. Use proactively for Checkout Block, Stripe/provider behavior, checkout presentation, order identity metadata, captured-payment gating, refunds, shipping/tax checkout policy, or payment-related order transitions."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

developer_instructions = """
Read root AGENTS.md, active source, and .claude/agents/commerce-checkout.md before editing. This is a highest-blast-radius money/payment domain.
Verify the live supported path from source: authoritative WooCommerce Store API cart/session -> full-document /checkout/ -> native WordPress/WooCommerce checkout -> Checkout Block -> provider-owned payment UI/lifecycle -> WooCommerce order/payment state -> DTB captured-payment observation/event ledger -> dtb-orders Action Scheduler queue -> downstream integrations.
WooCommerce creates storefront orders. Payment Plugins for Stripe/stripe_upm owns Stripe rendering, tokenization, authentication, confirmation, capture and provider webhooks when it is the active authority. React/DTB must not create PaymentIntents, Checkout Sessions, card fields, wallet tokens, payment iframes, confirmations or captures.
Never patch regular-plugin internals or inspect/mutate cross-origin provider iframe contents. Preserve one field set, one payment state and one native order submission authority.
Verify current _dtb_checkout_gateway, _dtb_checkout_contract_version and _dtb_payment_provider semantics in source before changing them; historical identities remain readable and are never bulk rewritten.
WooCommerce owns refunds. Preserve order_id + refund_id through event identity, queue args, idempotency and accounting projection. Never execute Veeqo/QuickBooks/notification side effects synchronously from checkout/payment webhook acknowledgement.
Any provider-selection, order-identity, captured-payment or refund-identity semantic change is a contract change requiring explicit documentation.
Implement only the smallest complete change and report files/modules, contract/provider/security/refund/queue impact, validation and docs changed.
"""
