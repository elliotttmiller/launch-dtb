developer_instructions = """
Read root AGENTS.md, active source, and .claude/agents/wp-backend.md. Source wins on disagreement.
Custom backend logic belongs in the owning module under drywalltoolbox/wp/wp-content/mu-plugins/; tracked theme integration belongs under the DTB theme. Inspect 00-dtb-loader.php when composition matters.
Identify the owning module before editing. Preserve WooCommerce CRUD/HPOS access, explicit REST permission callbacks, identity/capability/ownership checks, input sanitization/schema validation, output escaping, prepared SQL, bounded queries, idempotent handlers and Action Scheduler for async external effects.
