# Drywall Toolbox project-scoped Codex configuration.
# Root AGENTS.md remains the repository engineering authority.
# Keep credentials, tokens, provider secrets, and machine-local settings out of this file.

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

# First-party, read-oriented documentation integration for current OpenAI/Codex docs.
# It requires no repository credential and is non-critical to project startup.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
default_tools_approval_mode = "auto"
startup_timeout_sec = 10
tool_timeout_sec = 30
