[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dtb-siteground-deploy"
version = "5.0.0"
description = "Drywall Toolbox SiteGround production management console"
requires-python = ">=3.11"
dependencies = [
  "textual>=1.0,<2",
  "rich>=13.9,<15",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
dtb-deploy = "dtb_deploy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtb_deploy"]
