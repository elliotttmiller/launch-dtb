[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dtb-siteground-deploy"
version = "1.0.0"
description = "Local-only Drywall Toolbox SiteGround deployment TUI"
requires-python = ">=3.12"
dependencies = [
  "textual>=1.0,<2",
  "rich>=13.9,<15",
  "pydantic>=2.10,<3",
]

[project.scripts]
dtb-deploy = "dtb_deploy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtb_deploy"]
